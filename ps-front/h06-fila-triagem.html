<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>H06 | Fila de triagem</title>
    <link rel="stylesheet" href="./css/pages/inicio.css" />
    <link rel="stylesheet" href="./css/pages/h06-fila-triagem.css" />
  </head>
  <body>
    <div data-componente="cabecalho"></div>

    <div class="dashboard-shell">
      <div data-componente="menu-lateral"></div>
      <main class="main-panel pagina-h06">
        <div class="header-panel">
          <div class="title-wrap">
            <h1>Fila de triagem</h1>
            <p>Pacientes aguardando triagem, ordenados pela chegada</p>
          </div>
          <button class="primary-button" id="atualizar-fila-triagem" type="button">Atualizar fila</button>
        </div>
          <section class="table-panel fila-triagem-panel" aria-label="Fila de triagem">
            <div class="table-scroll">
              <table>
                <thead>
                  <tr>
                    <th scope="col">Nº Atendimento</th>
                    <th scope="col">Paciente</th>
                    <th scope="col">Data e hora de chegada</th>
                    <th scope="col">Ação</th>
                  </tr>
                </thead>
                <tbody id="fila-triagem">
                  <tr><td colspan="4" class="estado-fila" role="status">Carregando fila de triagem...</td></tr>
                </tbody>
              </table>
            </div>
          </section>
      </main>
    </div>
    <script src="./components/layout.js"></script>
    <script src="./components/fila-triagem.js"></script>
  </body>
</html>
