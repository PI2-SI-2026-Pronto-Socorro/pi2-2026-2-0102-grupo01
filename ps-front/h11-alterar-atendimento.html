<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>H11 | Alterar atendimento</title>
    <link rel="stylesheet" href="./css/pages/inicio.css" />
    <link rel="stylesheet" href="./css/pages/h11-alterar-atendimento.css" />
  </head>
  <body>
    <div data-componente="cabecalho"></div>

    <div class="dashboard-shell">
      <div data-componente="menu-lateral"></div>
      <main class="main-panel pagina-h11">
        <div class="header-panel">
          <div class="title-wrap">
            <h1>Alterar atendimento</h1>
            <p id="identificacao-alteracao">Carregando atendimento...</p>
          </div>
        </div>

        <section class="page-card alteracao-card" aria-label="Formulário de alteração do atendimento">
          <div id="dados-alteracao" class="dados-alteracao" aria-live="polite"></div>
          <form id="form-alteracao" novalidate>
            <div class="campo-alteracao">
              <label for="status-atendimento">Situação do atendimento</label>
              <select id="status-atendimento" name="status_atendimento" required>
                <option>Aberto</option>
                <option>Triado</option>
                <option>Confirmado</option>
                <option>Encerrado</option>
                <option>Cancelado</option>
              </select>
            </div>
            <div class="campo-alteracao">
              <label for="motivo-alteracao">Motivo da alteração</label>
              <textarea id="motivo-alteracao" name="motivo_atendimento" maxlength="255" rows="4" required></textarea>
            </div>
            <p id="mensagem-alteracao" class="mensagem-alteracao" role="status" aria-live="polite"></p>
            <div class="acoes-alteracao">
              <a id="voltar-consulta" class="botao-secundario" href="./h05-consultar-atendimento.html">Voltar à consulta</a>
              <button class="botao-principal" type="submit" id="salvar-alteracao">Salvar alteração</button>
            </div>
          </form>
        </section>
      </main>
    </div>
    <script src="./components/layout.js"></script>
    <script src="./components/alterar-atendimento.js"></script>
  </body>
</html>
