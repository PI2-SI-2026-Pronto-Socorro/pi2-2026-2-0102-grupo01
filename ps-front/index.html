<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel de atendimentos | PS Madre Theodora</title>
    <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="./css/pages/inicio.css" />
  </head>
  <body>
    <div data-componente="cabecalho"></div>

    <div class="dashboard-shell">
      <div data-componente="menu-lateral"></div>

      <main class="main-panel" aria-label="Painel principal">
        <div class="header-panel">
          <div class="title-wrap">
            <h1>Painel de Atendimentos</h1>
            <p>Gestão de pacientes e fluxo de entrada do dia</p>
          </div>
          <a class="primary-button" href="./h04-abrir-atendimento.html">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <circle cx="12" cy="12" r="9" />
              <path d="M12 7v10m-5-5h10" />
            </svg>
            Novo Atendimento
          </a>
        </div>

        <section class="stats" aria-label="Estatísticas de atendimento">
          <article class="stat-card stat-open">
            <div><span>Abertos</span><strong id="total-abertos">-</strong></div>
            <span class="stat-dot" aria-hidden="true"></span>
          </article>
          <article class="stat-card stat-triaged">
            <div><span>Triados</span><strong id="total-triados">-</strong></div>
            <span class="stat-dot" aria-hidden="true"></span>
          </article>
          <article class="stat-card stat-confirmed">
            <div><span>Confirmados</span><strong id="total-confirmados">-</strong></div>
            <span class="stat-dot" aria-hidden="true"></span>
          </article>
          <article class="stat-card stat-closed">
            <div><span>Encerrados</span><strong id="total-encerrados">-</strong></div>
            <span class="stat-dot" aria-hidden="true"></span>
          </article>
        </section>

        <section class="table-panel" aria-label="Lista de atendimentos">
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                <th scope="col">Nº Atendimento</th>
                <th scope="col">Paciente</th>
                <th scope="col">Data de Nascimento</th>
                <th scope="col">CPF</th>
                <th scope="col">Classificação de Risco</th>
                <th scope="col">Status</th>
                <th scope="col">Hora Chegada</th>
                <th scope="col">Ações</th>
                </tr>
              </thead>
              <tbody id="lista-painel-atendimentos"></tbody>
            </table>
          </div>
          <footer class="table-footer">
            <p id="rodape-painel-atendimentos"></p>
          </footer>
        </section>
      </main>
    </div>
    <script src="./components/layout.js"></script>
    <script src="./components/painel-atendimentos.js"></script>
    <script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
