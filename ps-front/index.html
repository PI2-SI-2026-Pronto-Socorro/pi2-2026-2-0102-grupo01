<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel de atendimentos</title>
    <link rel="stylesheet" href="./css/pages/inicio.css" />
  </head>
  <body>
    <header class="topbar" aria-label="Cabeçalho principal"></header>

    <div class="dashboard-shell">
      <aside class="sidebar" aria-label="Menu lateral">
        <button class="menu-item active" type="button">Painel de Atendimentos</button>
        <button class="menu-item" type="button" onclick="window.location.href='./h02-buscar-paciente.html'">Buscar e Cadastrar<br />Paciente</button>
        <button class="menu-item" type="button">Histórico Geral</button>
      </aside>

      <main class="main-panel" aria-label="Painel principal">
        <div class="header-panel">
          <div class="title-wrap">
            <h1>Painel de atendimentos</h1>
            <p>Gestão de pacientes e fluxo de entrada do dia</p>
          </div>

          <button class="primary-button" type="button">Novo Atendimento</button>
        </div>

        <section class="stats" aria-label="Estatísticas de atendimento">
          <article class="stat-card">
            <span>Abertos</span>
            <strong>13</strong>
          </article>

          <article class="stat-card">
            <span>Triados</span>
            <strong>22</strong>
          </article>

          <article class="stat-card">
            <span>Confirmados</span>
            <strong>14</strong>
          </article>

          <article class="stat-card">
            <span>Encerrados</span>
            <strong>67</strong>
          </article>
        </section>

        <section class="table-panel" aria-label="Lista de atendimentos">
          <table>
            <thead>
              <tr>
                <th>N° Atendimento</th>
                <th>N° Atendimento</th>
                <th>N° Atendimento</th>
                <th>N° Atendimento</th>
                <th>N° Atendimento</th>
                <th>N° Atendimento</th>
                <th>N° Atendimento</th>
              </tr>
            </thead>
            <tbody>
              <tr><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
            </tbody>
          </table>
        </section>
      </main>
    </div>
  </body>
</html>
