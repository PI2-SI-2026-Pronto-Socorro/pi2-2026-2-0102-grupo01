<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PS Madre Theodora | Cadastro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" />
    <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="./css/tema-bootstrap.css" />
    <script src="./tema.js"></script>
  </head>
  <body class="pagina-acesso">
    <div class="position-fixed top-0 end-0 p-3">
      <button class="btn btn-light" type="button" data-alternar-tema aria-label="Alternar modo claro e escuro" title="Alternar modo claro e escuro">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="icone-tema-escuro"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="icone-tema-claro"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </button>
    </div>
    <main class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
      <div class="cartao-acesso card border-0 shadow w-100 p-4 p-lg-5">
        <div class="row g-4 g-lg-5">
            <div class="col-lg-6 d-flex align-items-center px-lg-5">
              <div class="w-100" style="max-width: 420px">
                <h1 class="fw-semibold mb-4" style="font-size: 2.125rem">Cadastro</h1>
                <form class="d-grid gap-3">
                <div>
                  <label class="form-label small fw-semibold" for="nome">Nome</label>
                  <div class="input-group">
                    <span class="input-group-text text-body-secondary"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg></span>
                    <input class="form-control py-2" id="nome" type="text" placeholder="Usuário" />
                  </div>
                </div>
                <div>
                  <label class="form-label small fw-semibold" for="email">E-mail</label>
                  <div class="input-group">
                    <span class="input-group-text text-body-secondary"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></span>
                    <input class="form-control py-2" id="email" type="email" placeholder="example@email.com" />
                  </div>
                </div>
                <div>
                  <label class="form-label small fw-semibold" for="senha">Senha</label>
                  <div class="input-group">
                    <span class="input-group-text text-body-secondary"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span>
                    <input class="form-control py-2" id="senha" type="password" placeholder="Digite sua senha" />
                  </div>
                </div>
                  <button type="button" class="btn btn-primary py-2 mt-2" onclick="window.location.href='./index.html'">Cadastrar</button>
                </form>
              </div>
            </div>
            <div class="col-lg-6 d-none d-lg-block">
              <div class="painel-visual position-relative h-100 text-white">
                <svg class="position-absolute top-50 start-0 translate-middle-y w-100" viewBox="0 0 440 300" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                  <path d="M190 30h60v80h80v60h-80v80h-60v-80h-80v-60h80z" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="7" stroke-linejoin="round" />
                  <path d="M0 140h120l14-22 16 22h22l14-62 18 104 14-52 12 10h50l12-18 12 18h136" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
                  <circle cx="360" cy="140" r="5" fill="#fff" />
                </svg>
                <div class="position-absolute bottom-0 start-0 p-4 d-flex align-items-center gap-2">
                  <span class="d-inline-flex align-items-center justify-content-center bg-white text-primary rounded-1" style="width:30px;height:30px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/></svg></span>
                  <div class="lh-sm">
                    <div class="fw-semibold">PS Madre Theodora</div>
                    <div class="small opacity-75">Pronto-socorro 24 horas</div>
                  </div>
                </div>
              </div>
            </div>
        </div>
      </div>
    </main>
    <script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
