<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Cadastro de profissional</title>
	<link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
	<link rel="stylesheet" href="./css/pages/inicio.css">
	<link rel="stylesheet" href="./css/pages/h03-cadastrar-paciente.css">
</head>
<body class="page-dashboard">
	<div data-componente="cabecalho"></div>
	<div class="dashboard-shell">
		<div data-componente="menu-lateral"></div>
		<main class="main-panel">
			<section class="page-card form-card">
				<div class="header-panel">
					<h1>Novo profissional</h1>
					<p>Cadastro de profissional no sistema</p>
				</div>
				<form class="formulario-paciente" id="form-cadastro-profissional" novalidate>
					<div class="campo">
						<label for="nome-profissional">Nome completo <span class="obrigatorio">*</span></label>
						<input type="text" id="nome-profissional" name="nome" maxlength="100" placeholder="Digite o nome completo" required>
						<small class="erro-campo" data-erro="nome"></small>
					</div>
					<div class="campo">
						<label for="cpf-profissional">CPF <span class="obrigatorio">*</span></label>
						<input type="text" id="cpf-profissional" name="cpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" required>
						<small class="erro-campo" data-erro="cpf"></small>
					</div>
					<div class="campo">
						<label for="cargo-profissional">Cargo <span class="obrigatorio">*</span></label>
						<select id="cargo-profissional" name="cargo" required>
							<option value="">Selecione</option>
							<option value="medico">Médico</option>
							<option value="enfermeiro">Enfermeiro</option>
							<option value="tecnico">Técnico de Enfermagem</option>
							<option value="recepcionista">Recepcionista</option>
							<option value="outro">Outro</option>
						</select>
						<small class="erro-campo" data-erro="cargo"></small>
					</div>
					<div class="campo">
						<label for="telefone-profissional">Telefone</label>
						<input type="tel" id="telefone-profissional" name="telefone" placeholder="(00) 00000-0000">
					</div>
					<div class="campo">
						<label for="registro-profissional">Registro profissional</label>
						<input type="text" id="registro-profissional" name="registro_profissional" placeholder="Número do registro">
					</div>
					<div class="campo">
						<label for="especialidade-profissional">Especialidade</label>
						<input type="text" id="especialidade-profissional" name="especialidade" placeholder="Informe a especialidade">
					</div>
					<div class="campo">
						<label for="plantao-profissional">Plantão</label>
						<input type="text" id="plantao-profissional" name="plantao" placeholder="Informe o plantão">
					</div>
					<div class="campo">
						<label for="perfil-profissional">Perfil de acesso <span class="obrigatorio">*</span></label>
						<select id="perfil-profissional" name="perfil" required>
							<option value="">Selecione</option>
							<option value="recepcao">Recepção</option>
							<option value="enfermagem">Enfermagem</option>
							<option value="medico">Médico</option>
						</select>
						<small class="erro-campo" data-erro="perfil"></small>
					</div>
					<div class="campo">
						<label for="usuario-profissional">Usuário <span class="obrigatorio">*</span></label>
						<input type="text" id="usuario-profissional" name="usuario" placeholder="Crie um nome de usuário" required>
						<small class="erro-campo" data-erro="usuario"></small>
					</div>
					<div class="campo">
						<label for="senha-profissional">Senha <span class="obrigatorio">*</span></label>
						<input type="password" id="senha-profissional" name="senha" placeholder="Crie uma senha" required>
						<small class="erro-campo" data-erro="senha"></small>
					</div>
					<div class="campo largura-total" id="mensagem-cadastro-profissional" role="status" aria-live="polite"></div>
					<div class="botoes-acoes">
						<a href="./index.html" class="botao botao-secundario">Cancelar</a>
						<button type="submit" class="botao botao-principal">Cadastrar profissional</button>
					</div>
				</form>
			</section>
		</main>
	</div>
	<script src="./components/layout.js"></script>
	<script src="./components/cadastro-profissional.js"></script>
	<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
