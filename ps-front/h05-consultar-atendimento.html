<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>H05 | Consultar atendimento</title>
    <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="./css/pages/inicio.css" />
    <link rel="stylesheet" href="./css/pages/h05-consultar-atendimento.css" />
  </head>
  <body>
    <div data-componente="cabecalho"></div>

    <div class="dashboard-shell">
      <div data-componente="menu-lateral"></div>
      <main class="main-panel pagina-h05">
        <div class="header-panel">
          <div class="title-wrap">
            <h1>Consultar atendimento</h1>
            <p>Consulte a situação e os dados de um atendimento</p>
          </div>
        </div>
          <section class="page-card consulta-card" aria-label="Consulta de atendimento">
            <form id="form-consulta-atendimento" class="busca-form">
              <label for="identificador-atendimento">Número do atendimento ou CPF do paciente</label>
              <div class="linha-busca">
                <input id="identificador-atendimento" type="text" autocomplete="off" placeholder="Ex.: AT0001 ou 000.000.000-00" required />
                <button type="submit" class="botao-principal">Consultar</button>
              </div>
            </form>
            <div id="resultado-consulta" class="resultado-consulta" aria-live="polite">
              <p>Informe o número do atendimento ou o CPF do paciente.</p>
            </div>
          </section>
      </main>
    </div>
    <script src="./components/layout.js"></script>
    <script src="./components/consultar-atendimento.js"></script>
    <script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
