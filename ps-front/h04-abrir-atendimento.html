<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>H04 | Abrir atendimento com número</title>
    <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="./css/pages/inicio.css" />
    <link rel="stylesheet" href="./css/pages/h04-abrir-atendimento.css" />
  </head>
  <body>
    <div data-componente="cabecalho"></div>

    <div class="dashboard-shell">
      <div data-componente="menu-lateral"></div>
      <main class="main-panel pagina-h04">
        <div class="header-panel">
          <div class="title-wrap">
            <h1>Abrir atendimento</h1>
            <p>Localize o paciente para abrir um novo atendimento</p>
          </div>
        </div>
          <section class="page-card atendimento-card" aria-label="Abertura de atendimento">
            <form id="form-busca-atendimento" class="busca-form">
              <label for="cpf-atendimento">Buscar paciente pelo CPF</label>
              <div class="linha-busca">
                <input id="cpf-atendimento" type="text" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" required />
                <button type="submit" class="botao-principal">Buscar paciente</button>
              </div>
            </form>
            <div id="resultado-paciente" class="resultado-atendimento" aria-live="polite">
              <p>Busque um paciente para abrir o atendimento.</p>
            </div>
          </section>
      </main>
    </div>
    <script src="./components/layout.js"></script>
    <script src="./components/abrir-atendimento.js"></script>
    <script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
