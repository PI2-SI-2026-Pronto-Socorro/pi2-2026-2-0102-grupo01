<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buscar paciente pelo CPF</title>
    <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="./css/pages/inicio.css" />
    <link rel="stylesheet" href="./css/pages/h02-buscar-paciente.css" />
  </head>
  <body class="page-dashboard">
    <div data-componente="cabecalho"></div>

    <div class="dashboard-shell">
      <div data-componente="menu-lateral"></div>

      <main class="main-panel">
        <div class="header-panel">
          <div class="title-wrap">
            <h1>Buscar paciente</h1>
            <p>Consulta por CPF e acesso ao cadastro do paciente</p>
          </div>
        </div>

        <section class="page-card search-card" aria-label="Busca de paciente">
          <form id="form-busca" class="busca-form">
            <label for="cpf">Buscar paciente por CPF</label>
            <div class="linha-busca">
              <input id="cpf" type="text" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" autocomplete="off" />
              <button type="submit" class="botao-principal">Buscar paciente</button>
            </div>
          </form>

          <div id="resultado" class="resultado" aria-live="polite">
            <p>Informe o CPF do paciente para iniciar a busca.</p>
          </div>

          <div class="acoes-paciente">
            <a class="botao-principal" href="./h03-cadastrar-paciente.html">Novo Cadastro</a>
          </div>
        </section>
      </main>
    </div>

    <script src="./components/layout.js"></script>
    <script src="./app.js"></script>
    <script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
