<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buscar paciente pelo CPF</title>
    <link rel="stylesheet" href="./css/pages/inicio.css" />
    <link rel="stylesheet" href="./css/pages/h02-buscar-paciente.css" />
  </head>
  <body class="page-dashboard">
    <header class="topbar" aria-label="Cabeçalho principal"></header>

    <div class="dashboard-shell">
      <aside class="sidebar" aria-label="Menu lateral">
        <button class="menu-item" type="button" onclick="window.location.href='./index.html'">Painel de Atendimentos</button>
        <button class="menu-item active" type="button" onclick="window.location.href='./h02-buscar-paciente.html'">Buscar e Cadastrar<br />Paciente</button>
        <button class="menu-item" type="button" onclick="window.location.href='./index.html'">Histórico Geral</button>
      </aside>

      <main class="main-panel">
        <div class="header-panel">
          <div class="title-wrap">
            <h1>Buscar paciente</h1>
            <p>Consulta por CPF e acesso ao cadastro do paciente</p>
          </div>

          <button class="primary-button" type="button" onclick="window.location.href='./h03-cadastrar-paciente.html'">Novo Cadastro</button>
        </div>

        <section class="page-card search-card" aria-label="Busca de paciente">
          <form id="form-busca" class="busca-form">
            <label for="cpf">Buscar paciente por CPF</label>
            <div class="linha-busca">
              <input id="cpf" type="text" maxlength="14" placeholder="Digite o CPF" />
              <button type="submit" class="botao-principal">Buscar</button>
            </div>
          </form>

          <div id="resultado" class="resultado">
            <p>Informe um CPF para iniciar a busca.</p>
          </div>
        </section>
      </main>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
