<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pronto Socorro</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="conteudo">
      <section id="inicio" class="pagina ativa">
        <div class="cabecalho">
          <p class="tag">Pronto Socorro</p>
          <h1>Selecione a área</h1>
        </div>

        <div class="grid">
          <button class="cartao" data-pagina="recepcao">
            <span class="icone">🧾</span>
            <strong>Recepção</strong>
            <small>Busca por CPF e cadastro inicial.</small>
          </button>

          <button class="cartao" data-pagina="triagem">
            <span class="icone">🩺</span>
            <strong>Triagem</strong>
            <small>Avaliação inicial do paciente.</small>
          </button>

          <button class="cartao" data-pagina="medico">
            <span class="icone">👩‍⚕️</span>
            <strong>Médico</strong>
            <small>Atendimento clínico e evolução.</small>
          </button>
        </div>
      </section>

      <section id="recepcao" class="pagina">
        <div class="topo">
          <button class="botao-voltar" data-pagina="inicio">← Voltar</button>
        </div>

        <div class="cabecalho pequeno">
          <p class="tag">Área</p>
          <h2>Recepção</h2>
        </div>

        <form id="form-busca" class="busca">
          <label for="cpf">Buscar paciente por CPF</label>
          <div class="linha-busca">
            <input id="cpf" type="text" maxlength="11" placeholder="Digite o CPF" />
            <button type="submit" class="botao-principal">Buscar</button>
          </div>
        </form>

        <div id="resultado" class="resultado">
          <p>Informe um CPF para iniciar a busca.</p>
        </div>
      </section>

      <section id="triagem" class="pagina">
        <div class="topo">
          <button class="botao-voltar" data-pagina="inicio">← Voltar</button>
        </div>

        <div class="cabecalho pequeno">
          <p class="tag">Área</p>
          <h2>Triagem</h2>
        </div>

        <div class="caixa-vazia">
          <p>Essa tela será implementada depois.</p>
        </div>
      </section>

      <section id="medico" class="pagina">
        <div class="topo">
          <button class="botao-voltar" data-pagina="inicio">← Voltar</button>
        </div>

        <div class="cabecalho pequeno">
          <p class="tag">Área</p>
          <h2>Médico</h2>
        </div>

        <div class="caixa-vazia">
          <p>Essa tela será implementada depois.</p>
        </div>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
