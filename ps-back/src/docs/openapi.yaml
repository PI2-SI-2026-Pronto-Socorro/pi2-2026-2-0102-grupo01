openapi: 3.0.0
info:
  title: API Pronto-Socorro
  version: 1.0.0
  description: >-
    Cadastro de pacientes e atendimentos. Para usar as rotas protegidas, faça login em `POST /auth/login`
    e clique em "Authorize" com o token. O controle de acesso por perfil só é exigido quando o servidor
    roda com `AUTH_OBRIGATORIA=true` no `.env`.
servers:
  - url: /api

tags:
  - name: Teste
  - name: Autenticação
  - name: Profissionais
  - name: Pacientes
  - name: Atendimentos

security:
  - tokenDeAcesso: []

paths:
  /health:
    get:
      tags: [Teste]
      summary: Confirma a conexão com o banco lendo a tabela paciente
      responses:
        '200':
          description: Banco conectado
          content:
            application/json:
              example: { banco: ok, pacientes: 3 }

  /pacientes:
    get:
      tags: [Pacientes]
      summary: Lista todos os pacientes
      responses:
        '200':
          description: Lista de pacientes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Paciente' }
    post:
      tags: [Pacientes]
      summary: Cadastra um paciente
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NovoPaciente' }
      responses:
        '201':
          description: Paciente cadastrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Paciente' }
        '409':
          description: CPF já cadastrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '422':
          description: Dados obrigatórios ausentes ou inválidos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }

  /pacientes/{cpf}:
    get:
      tags: [Pacientes]
      summary: Busca um paciente pelo CPF, com o status do último atendimento
      parameters:
        - in: path
          name: cpf
          required: true
          schema: { type: string, example: '12345678900' }
      responses:
        '200':
          description: Paciente encontrado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paciente'
                  - type: object
                    properties:
                      status: { type: string, nullable: true, example: Aberto, description: Status do último atendimento }
        '404':
          description: Paciente não encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
    patch:
      tags: [Pacientes]
      summary: Altera os dados cadastrais de um paciente pelo CPF
      description: >-
        Altera só os campos enviados. Ao enviar um novo cpf, ele precisa ter dígitos verificadores válidos
        e não pode pertencer a outro paciente.
      parameters:
        - in: path
          name: cpf
          required: true
          schema: { type: string, pattern: '^\d{11}$', example: '12345678900' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlteracaoPaciente' }
            example: { telefone: (19) 98765-4321, genero: Feminino }
      responses:
        '200':
          description: Paciente alterado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Paciente' }
        '404':
          description: Paciente não encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '409':
          description: CPF já cadastrado para outro paciente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '422':
          description: CPF da rota inválido, corpo vazio, campo não permitido ou valor inválido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              example: { detail: 'Campo não pode ser alterado: endereco' }

  /atendimentos:
    get:
      tags: [Atendimentos]
      summary: Busca os atendimentos de um paciente pelo CPF
      description: Devolve do mais recente para o mais antigo, com o nome e o CPF do paciente. Lista vazia quando o CPF não tem atendimentos.
      parameters:
        - in: query
          name: cpf
          required: true
          schema: { type: string, example: '12345678900' }
      responses:
        '200':
          description: Atendimentos do paciente
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/Atendimento'
                    - type: object
                      properties:
                        nome: { type: string, example: Maria da Silva }
                        cpf: { type: string, nullable: true, example: '12345678900' }
        '422':
          description: CPF ausente ou inválido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
    post:
      tags: [Atendimentos]
      summary: Abre um atendimento para um paciente
      description: >
        O atendimento sempre é aberto com status "Aberto". O número (numero_atendimento,
        no formato AT000000001) e a data e hora de chegada são gerados pelo banco. Um paciente
        não pode ter dois atendimentos em andamento (status diferente de "Encerrado" e "Cancelado").
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_paciente]
              properties:
                id_paciente: { type: string, format: uuid, example: 3f2b8c1e-9a4d-4e7b-8c21-5d6f7a8b9c0d }
      responses:
        '201':
          description: Atendimento aberto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Atendimento' }
        '404':
          description: Paciente não existe
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '409':
          description: Paciente já possui atendimento em andamento
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              example: { detail: Paciente já possui atendimento em andamento (nº AT0008) }
        '422':
          description: id_paciente inválido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }

  /atendimentos/abertos:
    get:
      tags: [Atendimentos]
      summary: Lista os atendimentos em Aberto, por hora de chegada
      description: Fila de atendimento, de quem chegou primeiro para quem chegou por último. Lista vazia quando não há atendimentos abertos.
      responses:
        '200':
          description: Atendimentos abertos
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/Atendimento'
                    - type: object
                      properties:
                        nome: { type: string, example: Maria da Silva }

  /atendimentos/triados:
    get:
      tags: [Atendimentos]
      summary: Painel do médico - atendimentos em Triado, na ordem de Manchester
      description: >-
        Lista só os atendimentos em Triado, ordenados pela classificação de risco do Protocolo de Manchester
        (Emergência/vermelho primeiro, depois Muito Urgente/laranja, Urgente/amarelo, Pouco Urgente/verde e
        Não Urgente/azul) e, na mesma cor, pela hora de chegada. Um atendimento Triado sem triagem gravada aparece
        no fim da lista, com classificação e cor nulas. Lista vazia quando não há atendimentos triados.
      responses:
        '200':
          description: Atendimentos triados
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/Atendimento'
                    - type: object
                      properties:
                        nome: { type: string, example: Maria da Silva }
                        data_nascimento: { type: string, format: date, nullable: true, example: '1990-03-14' }
                        classificacao_risco:
                          type: string
                          nullable: true
                          enum: [Emergência, Muito Urgente, Urgente, Pouco Urgente, Não Urgente]
                          example: Emergência
                        cor: { type: string, nullable: true, enum: [Vermelho, Laranja, Amarelo, Verde, Azul], example: Vermelho }
                        data_hora_triagem: { type: string, format: date-time, nullable: true, example: '2026-10-25T21:50:02.110Z' }

  /atendimentos/{numero}:
    get:
      tags: [Atendimentos]
      summary: Busca um atendimento pelo número
      description: Devolve também o nome e o CPF do paciente.
      parameters:
        - in: path
          name: numero
          required: true
          schema: { type: string, pattern: '^AT\d{4,9}$', example: AT0008 }
      responses:
        '200':
          description: Atendimento encontrado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Atendimento'
                  - type: object
                    properties:
                      nome: { type: string, example: Maria da Silva }
                      cpf: { type: string, nullable: true, example: '12345678900' }
        '404':
          description: Atendimento não encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '422':
          description: Número do atendimento inválido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
    patch:
      tags: [Atendimentos]
      summary: Altera os dados do atendimento e os dados cadastrais do paciente
      description: >-
        Altera só os campos enviados. Permitido enquanto o atendimento está em Aberto ou Triado;
        em Confirmado, Encerrado ou Cancelado a alteração é recusada. A situação do atendimento não muda.
      parameters:
        - in: path
          name: numero
          required: true
          schema: { type: string, pattern: '^AT\d{4,9}$', example: AT0008 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlteracaoAtendimento' }
            example: { motivo_atendimento: Dor abdominal, telefone: (19) 98765-4321 }
      responses:
        '200':
          description: Atendimento alterado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Atendimento'
                  - type: object
                    properties:
                      motivo_atendimento: { type: string, nullable: true, example: Dor abdominal }
                      paciente: { $ref: '#/components/schemas/Paciente' }
        '404':
          description: Atendimento não encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '409':
          description: Atendimento em Confirmado, Encerrado ou Cancelado, ou CPF já usado por outro paciente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              example: { detail: 'Não é possível alterar atendimento Cancelado (só em Aberto ou Triado)' }
        '422':
          description: Número do atendimento inválido, campo não permitido ou valor inválido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }

  /atendimentos/{numero}/cancelar:
    patch:
      tags: [Atendimentos]
      summary: Cancela um atendimento em Aberto
      description: Só cancela atendimento com situação Aberto; nos outros estados a operação é recusada. O atendimento cancelado sai da fila de triagem.
      parameters:
        - in: path
          name: numero
          required: true
          schema: { type: string, pattern: '^AT\d{4,9}$', example: AT0008 }
      responses:
        '200':
          description: Atendimento cancelado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Atendimento' }
              example:
                id_atendimento: 7c1d2e3f-4a5b-4c6d-8e7f-9a0b1c2d3e4f
                numero_atendimento: AT0008
                id_paciente: 3f2b8c1e-9a4d-4e7b-8c21-5d6f7a8b9c0d
                status_atendimento: Cancelado
                data_hora_chegada: '2026-10-25T21:39:14.490Z'
        '404':
          description: Atendimento não encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '409':
          description: Atendimento não está em Aberto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              example: { detail: 'Só é possível cancelar atendimento em Aberto (situação atual: Triado)' }
        '422':
          description: Número do atendimento inválido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }

  /auth/login:
    post:
      tags: [Autenticação]
      summary: Entra com usuário e senha e devolve o token e o perfil
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [usuario, senha]
              properties:
                usuario: { type: string, example: maria.recepcao }
                senha: { type: string, format: password, example: senha1234 }
      responses:
        '200':
          description: Login feito
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  expira_em: { type: string, format: date-time }
                  profissional:
                    type: object
                    properties:
                      id_profissional: { type: string, format: uuid }
                      nome: { type: string, example: Maria Souza }
                      cargo: { type: string, example: Recepcionista }
                      perfil: { type: string, enum: [Recepção, Enfermagem, Médico], example: Recepção }
        '401':
          description: Usuário ou senha inválidos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '422':
          description: Usuário ou senha não informados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }

  /auth/eu:
    get:
      tags: [Autenticação]
      summary: Devolve o profissional do token
      responses:
        '200':
          description: Profissional logado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profissional' }
        '401':
          description: Sem token ou token vencido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }

  /profissionais:
    get:
      tags: [Profissionais]
      summary: Lista os profissionais por nome
      responses:
        '200':
          description: Profissionais
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id_profissional: { type: string, format: uuid }
                    nome: { type: string }
                    cargo: { type: string }
    post:
      tags: [Profissionais]
      summary: Cadastra um profissional (perfil Recepção)
      description: >-
        Grava a senha só como hash (scrypt). O cargo define o perfil: Médico → Médico; Enfermeiro e Técnico
        de Enfermagem → Enfermagem; Recepcionista → Recepção. O CRM é obrigatório para médico.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NovoProfissional' }
      responses:
        '201':
          description: Profissional cadastrado (sem a senha)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profissional' }
        '409':
          description: CPF, usuário ou registro profissional já cadastrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              example: { detail: Usuário já está em uso }
        '422':
          description: Dado inválido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }

  /atendimentos/nao-identificado:
    post:
      tags: [Atendimentos]
      summary: Abre atendimento para paciente sem RG e CPF (perfil Recepção)
      description: >-
        Cria o paciente sem documento e já abre o atendimento em Aberto. O nome é opcional
        (padrão "Paciente não identificado"). Os dados são completados depois pelo
        `PATCH /atendimentos/{numero}`, no mesmo cadastro.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                nome: { type: string, maxLength: 100, example: Homem aproximadamente 40 anos }
                data_nascimento: { type: string, format: date }
                genero: { type: string, maxLength: 20, example: Masculino }
                telefone: { type: string, maxLength: 15 }
                motivo_atendimento: { type: string, maxLength: 255, example: Encontrado desacordado na rua }
      responses:
        '201':
          description: Atendimento aberto
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Atendimento'
                  - type: object
                    properties:
                      paciente: { $ref: '#/components/schemas/Paciente' }
        '422':
          description: Dado inválido, ou CPF/RG enviado (use o cadastro normal)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }

  /atendimentos/{numero}/reserva:
    post:
      tags: [Atendimentos]
      summary: Reserva o atendimento para o médico que o abriu (perfil Médico)
      description: >-
        Só para atendimento Triado. O médico vem do token; sem login obrigatório, mande `id_profissional`
        no corpo. O mesmo médico pode chamar de novo; outro médico recebe 409. Depois da reserva, medicação e
        confirmação feitas por outro médico também são recusadas.
      parameters:
        - in: path
          name: numero
          required: true
          schema: { type: string, pattern: '^AT\d{4,9}$', example: AT0008 }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id_profissional: { type: string, format: uuid }
      responses:
        '200':
          description: Atendimento reservado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Atendimento'
                  - type: object
                    properties:
                      id_profissional: { type: string, format: uuid }
                      medico_responsavel: { type: string, example: Dra. Juliana Prates Moreira }
        '403':
          description: Profissional não é médico
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '404':
          description: Atendimento ou profissional não encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '409':
          description: Atendimento com outro médico ou fora de Triado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              example: { detail: Atendimento já está com Dr. Ricardo Almeida Souza }

components:
  securitySchemes:
    tokenDeAcesso:
      type: http
      scheme: bearer
  schemas:
    Atendimento:
      type: object
      properties:
        id_atendimento: { type: string, format: uuid, example: 7c1d2e3f-4a5b-4c6d-8e7f-9a0b1c2d3e4f }
        numero_atendimento: { type: string, example: AT0008 }
        id_paciente: { type: string, format: uuid, example: 3f2b8c1e-9a4d-4e7b-8c21-5d6f7a8b9c0d }
        status_atendimento: { type: string, enum: [Aberto, Triado, Confirmado, Encerrado, Cancelado], example: Aberto }
        data_hora_chegada: { type: string, format: date-time, example: '2026-10-25T21:39:14.490Z' }
        data_hora_saida: { type: string, format: date-time, nullable: true, example: '2026-10-25T23:05:41.020Z' }
    Paciente:
      type: object
      properties:
        id_paciente: { type: string, format: uuid, example: 3f2b8c1e-9a4d-4e7b-8c21-5d6f7a8b9c0d }
        nome: { type: string, example: Maria da Silva }
        cpf: { type: string, nullable: true, example: '12345678900' }
        rg: { type: string, nullable: true, example: '123456789' }
        data_nascimento: { type: string, format: date, nullable: true, example: '1990-03-14' }
        genero: { type: string, nullable: true, example: Feminino }
        telefone: { type: string, nullable: true, example: (11) 98765-4321 }
    NovoPaciente:
      type: object
      required: [nome, cpf, data_nascimento]
      properties:
        nome: { type: string, maxLength: 100, example: Maria da Silva }
        cpf: { type: string, pattern: '^\d{11}$', example: '12345678900' }
        rg: { type: string, maxLength: 15, example: '123456789' }
        data_nascimento: { type: string, format: date, example: '1990-03-14' }
        genero: { type: string, maxLength: 20, example: Feminino }
        telefone: { type: string, maxLength: 15, example: (11) 98765-4321 }
    AlteracaoPaciente:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        nome: { type: string, maxLength: 100, example: Maria da Silva }
        cpf: { type: string, pattern: '^\d{11}$', example: '12345678900' }
        rg: { type: string, nullable: true, maxLength: 15, example: '123456789' }
        data_nascimento: { type: string, format: date, example: '1990-03-14' }
        genero: { type: string, nullable: true, maxLength: 20, example: Feminino }
        telefone: { type: string, nullable: true, maxLength: 15, example: (11) 98765-4321 }
    AlteracaoAtendimento:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        motivo_atendimento: { type: string, nullable: true, maxLength: 255, example: Dor abdominal }
        nome: { type: string, maxLength: 100, example: Maria da Silva }
        cpf: { type: string, pattern: '^\d{11}$', example: '12345678900' }
        rg: { type: string, nullable: true, maxLength: 15, example: '123456789' }
        data_nascimento: { type: string, format: date, example: '1990-03-14' }
        genero: { type: string, nullable: true, maxLength: 20, example: Feminino }
        telefone: { type: string, nullable: true, maxLength: 15, example: (11) 98765-4321 }
    Profissional:
      type: object
      properties:
        id_profissional: { type: string, format: uuid }
        nome: { type: string, example: Maria Souza }
        cpf: { type: string, example: '52998224725' }
        telefone: { type: string, nullable: true }
        cargo: { type: string, enum: [Médico, Enfermeiro, Técnico de Enfermagem, Recepcionista, Outro] }
        registro_profissional: { type: string, nullable: true, example: CRM-SP 123456 }
        plantao: { type: string, nullable: true }
        especialidade: { type: string, nullable: true }
        perfil: { type: string, enum: [Recepção, Enfermagem, Médico] }
        usuario: { type: string, example: maria.recepcao }
    NovoProfissional:
      type: object
      required: [nome, cpf, cargo, perfil, usuario, senha]
      properties:
        nome: { type: string, maxLength: 100, example: Maria Souza }
        cpf: { type: string, example: '52998224725' }
        cargo: { type: string, enum: [Médico, Enfermeiro, Técnico de Enfermagem, Recepcionista, Outro], example: Recepcionista }
        perfil: { type: string, enum: [Recepção, Enfermagem, Médico], example: Recepção }
        usuario: { type: string, pattern: '^[a-z0-9._-]{3,50}$', example: maria.recepcao }
        senha: { type: string, format: password, minLength: 8, maxLength: 72, example: senha1234 }
        registro_profissional: { type: string, maxLength: 25 }
        telefone: { type: string, maxLength: 15 }
        especialidade: { type: string, maxLength: 80 }
        plantao: { type: string, maxLength: 50 }
    Erro:
      type: object
      properties:
        detail: { type: string, example: CPF já cadastrado }
